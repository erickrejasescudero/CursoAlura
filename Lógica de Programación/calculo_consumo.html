<meta charset="UTF-8">
<h3>¿Alcohol o gasolina?</h3>

<script>
	
	var tanque = 40;

	var recorridoGas = 480;
	var consumoGas = recorridoGas/tanque;

	var recorridoAlc = 300;
	var consumoAlc = recorridoAlc/tanque;

	document.write("El consumo con Gasolina es: " + consumoGas + " Km/L")

	document.write("<br>")
	document.write("<br>")
	document.write("El consumo con Alcohol es: " + consumoAlc + " Km/L")

</script>
