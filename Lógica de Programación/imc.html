<meta charset="UTF-8">

<h1>PROGRAMA CALCULAR IMC</h1>

<script>

	function saltarLinea() {

		document.write("<br>");
		document.write("<br>");
		document.write("<br>");

	}

	function imprimir(frase) {

		document.write(frase);
		saltarLinea();

	}

	function calcularImc(peso, altura) {

		return peso/(altura * altura);

	}

	nombre = prompt("Informe su nombre")
	pesoInformado = prompt(nombre + ", informe su peso:")
	alturaInformado = prompt(nombre + ", informe su altura:")

	imcCalculado = calcularImc(pesoInformado, alturaInformado)

	imprimir(nombre + ", su imc calculado es: " + imcCalculado)

	if (imcCalculado < 18.5)  {
		imprimir("Imc por debajo de lo recomendado")
	}
	
	if (imcCalculado >= 18.5)  {
		if (imcCalculado < 25) {
			imprimir("Imc dentro del intervalo normal")
		}
	}


	if (imcCalculado >= 25)  {
		if (imcCalculado < 30) {
			imprimir("Imc considerado como sobrepeso")
		}
		
	}

	if (imcCalculado > 30)  {
		imprimir("Imc considerado como obesidad")
	}

	//var imcErick = calcularImc(79, 1.86);
	//var imcNico = calcularImc(90, 1.80);

	//imprimir("El promedio del imc calculado de Erick y Nico es: " + (calcularImc(79, 1.86) +calcularImc(90, 1.80))/2 );

	//imprimir("El promedio del imc calculado de Gabriela y Luisa es: " + (calcularImc(60, 1.70) +calcularImc(55, 1.60))/2 );
</script>
