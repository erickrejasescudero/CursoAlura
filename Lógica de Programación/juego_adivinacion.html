<meta charset="UTF-8">

<h1>PROGRAMA JUEGO DE ADIVINACION</h1>

<script>

	function saltarLinea() {

		document.write("<br>");
		document.write("<br>");
		document.write("<br>");

	}

	function imprimir(frase) {

		document.write(frase);
		saltarLinea();
	}

	function sorteo(n) {
		return Math.round(Math.random()*n);
	}

	var n = 10;
	var numeroPensado = sorteo(n);
	var intentos = 3;
	var contador = 1;

	while(contador <= intentos) {

		var numeroLanzado = parseInt(prompt("Ingrese un número entre 0 - 10"));

		if (numeroPensado == numeroLanzado) {
			
			alert("Usted acertó en el intento Nro " + contador +", el número pensado era " + numeroPensado);
			break;

		}else{
			if (numeroLanzado < numeroPensado) {
				alert("Usted erró, el número que usted dio era menor al número del juego ");
			}else{
				alert("Usted erró, el número que usted dio era mayor al número del juego ");
			}
		}
		contador++
	}

	if (numeroPensado == numeroLanzado) {
			
		imprimir("Usted acertó en el intento Nro " + contador +", el número pensado era " + numeroPensado);
	}else{
		imprimir("Usted erró en todos los intentos, el número pensado era " + numeroPensado);
	}

	imprimir("FIN")

</script>
